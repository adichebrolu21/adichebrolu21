<svg xmlns="http://www.w3.org/2000/svg" width="440" height="220" viewBox="0 0 440 220">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#161b22"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
<linearGradient id="ac" x1="0" x2="1"><stop offset="0" stop-color="#D2691E"/><stop offset="1" stop-color="#E8B94E"/></linearGradient></defs>
<style>
text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,Consolas,Menlo,monospace}
.t{font-size:26px;font-weight:700;fill:#f0f6fc}
.s{font-size:11px;fill:#8b949e;letter-spacing:1.6px}
.d{font-size:13px;fill:#9da7b3}
.c{font-size:10px;fill:#c9d1d9;letter-spacing:.8px}
.in{animation:in .9s ease both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes scan{from{transform:translateY(0)}to{transform:translateY(112px)}}
.scan{animation:scan 2.6s ease-in-out infinite alternate}
@keyframes pop{0%,15%{opacity:0}30%,85%{opacity:1}100%{opacity:0}}
.b{animation:pop 5.2s ease-in-out infinite;opacity:0}</style>
<rect x=".5" y=".5" width="439" height="219" rx="14" fill="url(#bg)" stroke="#30363d"/>
<rect x="24" y="0" width="60" height="3" rx="1.5" fill="url(#ac)"/>
<g class="in"><circle cx="30" cy="34" r="4" fill="#238636"/><circle cx="30" cy="34" r="4" fill="none" stroke="#3fb950"><animate attributeName="r" from="4" to="12" dur="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" from=".9" to="0" dur="1.8s" repeatCount="indefinite"/></circle><text x="44" y="38" class="m" style="font-size:10px;fill:#3fb950;letter-spacing:1.5px">LIVE · UNDER NDA</text><text x="30" y="84" class="t">Veri Detect</text><text x="30" y="106" class="s m">OCR · COMPUTER VISION</text><text x="30" y="142" class="d">Built with a client, end to end.</text><text x="30" y="162" class="d">Source stays private.</text><rect x="30" y="180" width="94" height="22" rx="11" fill="#161b22" stroke="#30363d"/><text x="77" y="195" text-anchor="middle" class="c m" style="fill:#c9d1d9">CLIENT WORK</text><rect x="131.9" y="180" width="39" height="22" rx="11" fill="#161b22" stroke="#8b949e"/><text x="151" y="195" text-anchor="middle" class="c m" style="fill:#8b949e">NDA</text><rect x="250" y="60" width="144" height="122" rx="8" fill="#0d1117" stroke="#30363d"/><rect x="262" y="72" width="120" height="5" rx="2.5" fill="#21262d"/><rect x="262" y="86" width="96" height="5" rx="2.5" fill="#21262d"/><rect x="262" y="100" width="124" height="5" rx="2.5" fill="#21262d"/><rect x="262" y="114" width="70" height="5" rx="2.5" fill="#21262d"/><rect x="262" y="128" width="110" height="5" rx="2.5" fill="#21262d"/><rect x="262" y="142" width="84" height="5" rx="2.5" fill="#21262d"/><rect x="262" y="156" width="118" height="5" rx="2.5" fill="#21262d"/><rect x="262" y="170" width="60" height="5" rx="2.5" fill="#21262d"/><rect class="b" style="animation-delay:0.0s" x="258" y="68" width="128" height="13" rx="3" fill="rgba(210,105,30,.12)" stroke="#D2691E" stroke-width="1.4"/><rect class="b" style="animation-delay:0.9s" x="258" y="96" width="104" height="13" rx="3" fill="rgba(210,105,30,.12)" stroke="#D2691E" stroke-width="1.4"/><rect class="b" style="animation-delay:1.8s" x="258" y="124" width="92" height="13" rx="3" fill="rgba(210,105,30,.12)" stroke="#D2691E" stroke-width="1.4"/><rect class="b" style="animation-delay:2.7s" x="258" y="152" width="124" height="13" rx="3" fill="rgba(210,105,30,.12)" stroke="#D2691E" stroke-width="1.4"/><g class="scan"><rect x="250" y="62" width="144" height="2" fill="#58A6FF"/><rect x="250" y="56" width="144" height="10" fill="#58A6FF" opacity=".12"/></g></g></svg>