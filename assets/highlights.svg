<svg xmlns="http://www.w3.org/2000/svg" width="900" height="120" viewBox="0 0 900 120"><style>
text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,Consolas,Menlo,monospace}
.t{font-size:26px;font-weight:700;fill:#f0f6fc}
.s{font-size:11px;fill:#8b949e;letter-spacing:1.6px}
.d{font-size:13px;fill:#9da7b3}
.c{font-size:10px;fill:#c9d1d9;letter-spacing:.8px}
.in{animation:in .9s ease both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes ring{0%{stroke-dashoffset:176}35%,88%{stroke-dashoffset:0}100%{stroke-dashoffset:176}}
.rg{stroke-dasharray:176;animation:ring 6s ease-in-out infinite}
@keyframes num{0%,8%{opacity:0;transform:translateY(6px)}30%,88%{opacity:1;transform:none}100%{opacity:0}}
.nm{animation:num 6s ease-in-out infinite}</style><rect x="20" y="14" width="273" height="92" rx="12" fill="#0d1117" stroke="#21262d"/><circle cx="70" cy="60" r="28" fill="none" stroke="#21262d" stroke-width="5"/><circle class="rg" style="animation-delay:0.0s;transform:rotate(-90deg);transform-origin:70px 60px" cx="70" cy="60" r="28" fill="none" stroke="#58A6FF" stroke-width="5" stroke-linecap="round"/><circle cx="70" cy="60" r="4" fill="#58A6FF"/><g class="nm" style="animation-delay:0.0s"><text x="114" y="58" style="font-size:26px;font-weight:700;fill:#f0f6fc">8.072</text><text x="114" y="80" class="m" style="font-size:9px;fill:#8b949e;letter-spacing:1.3px">IMPACT FACTOR · AEROREASON</text></g><rect x="313" y="14" width="273" height="92" rx="12" fill="#0d1117" stroke="#21262d"/><circle cx="363" cy="60" r="28" fill="none" stroke="#21262d" stroke-width="5"/><circle class="rg" style="animation-delay:0.4s;transform:rotate(-90deg);transform-origin:363px 60px" cx="363" cy="60" r="28" fill="none" stroke="#E8B94E" stroke-width="5" stroke-linecap="round"/><circle cx="363" cy="60" r="4" fill="#E8B94E"/><g class="nm" style="animation-delay:0.4s"><text x="407" y="58" style="font-size:26px;font-weight:700;fill:#f0f6fc">₹3,00,000</text><text x="407" y="80" class="m" style="font-size:9px;fill:#8b949e;letter-spacing:1.3px">HACKATHON PRIZE POOL · DIRECTED</text></g><rect x="606" y="14" width="273" height="92" rx="12" fill="#0d1117" stroke="#21262d"/><circle cx="656" cy="60" r="28" fill="none" stroke="#21262d" stroke-width="5"/><circle class="rg" style="animation-delay:0.8s;transform:rotate(-90deg);transform-origin:656px 60px" cx="656" cy="60" r="28" fill="none" stroke="#3fb950" stroke-width="5" stroke-linecap="round"/><circle cx="656" cy="60" r="4" fill="#3fb950"/><g class="nm" style="animation-delay:0.8s"><text x="700" y="58" style="font-size:26px;font-weight:700;fill:#f0f6fc">2</text><text x="700" y="80" class="m" style="font-size:9px;fill:#8b949e;letter-spacing:1.3px">LIVE CLIENT PROJECTS · NDA</text></g></svg>