@keyframes sweep{from{transform:translateX(0)}to{transform:translateX(120px)}}
.sw{animation:sweep 3.2s ease-in-out infinite alternate}
@keyframes bl{0%,100%{opacity:.25}50%{opacity:1}}
.bl{animation:bl 1.4s ease-in-out infinite}</style>
